<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Андрей Бескровных</title>
<meta name="description" content="Я делаю Дока — AI-компаньона, который отвечает на мои вопросы и помнит меня.">
<style>
:root{--ground:#f4f1ea;--ink:#14120f;--ink-dim:#6d655b;--gold:#8a6a12;--rule:#e0d9cc;
 --serif:Georgia,"Iowan Old Style","Times New Roman",serif;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--ground:#0b0a09;--ink:#f2ede4;--ink-dim:#9a9186;--gold:#c9a227;--rule:#241f1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:72px 16px 80px}
h1{font-weight:400;font-size:22px;margin:0 0 20px}
.me{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:0 0 24px}
p{font-size:19px;line-height:1.6;margin:0 0 40px}
ul{list-style:none;padding:0;margin:0 0 48px}
li{border-top:1px solid var(--rule)}
li:last-child{border-bottom:1px solid var(--rule)}
li a{display:block;padding:14px 0;font-size:19px;color:var(--ink);text-decoration:none}
li a:hover{color:var(--gold)}
.contact{font:14px var(--sans);color:var(--ink-dim)}
.contact a{color:var(--ink-dim)}
</style>
</head>
<body>
<main>
<img class="me" src="/me.jpg" alt="Андрей Бескровных" width="96" height="96">
<h1>Андрей Бескровных</h1>
<p>Я делаю Дока — AI-компаньона, который отвечает на мои вопросы и помнит меня.</p>
<ul>
<li><a href="/writing/">Тексты</a></li>
<li><a href="/photos/">Фотографии</a></li>
<li><a href="https://doktome.app">Док</a></li>
</ul>
<div class="contact">Написать мне: <a href="https://t.me/beskrovnykh">Telegram</a></div>
</main>
</body>
</html>
