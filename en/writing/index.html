<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Writing · Andrei Beskrovnykh</title><style>
:root{--ground:#f4f1ea;--ink:#14120f;--ink-dim:#6d655b;--gold:#8a6a12;--rule:#e0d9cc;
 --serif:Georgia,'Iowan Old Style','Times New Roman',serif;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--ground:#0b0a09;--ink:#f2ede4;--ink-dim:#9a9186;--gold:#c9a227;--rule:#241f1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:40px 16px 80px}
a{color:var(--gold)}
.back{font:12px var(--sans);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--ink-dim)}
.lbl{font:10px var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin:48px 0 10px}
h1{font-weight:400;font-size:34px;line-height:1.15;margin:0 0 8px}
h2{font-weight:400;font-size:25px;line-height:1.25;margin:1.8em 0 .6em}
h3{font-weight:400;font-size:21px;margin:1.5em 0 .5em}
.date{font:13px var(--sans);color:var(--ink-dim);margin:0 0 36px;padding-bottom:28px;border-bottom:1px solid var(--rule)}
p,li{font-size:19px;line-height:1.65}
p{margin:0 0 1.2em}ul,ol{padding-left:1.3em;margin:0 0 1.2em}li{margin:.3em 0}
.next{margin:40px 0 0;padding-top:20px;border-top:1px solid var(--rule)}
.next span{display:block;font:10px var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.epi{font-style:italic;text-align:right;color:var(--ink-dim);margin:0 0 2em 20%}
blockquote{margin:0 0 1.2em;padding-left:16px;border-left:2px solid var(--rule);color:var(--ink-dim)}
hr{border:0;border-top:1px solid var(--rule);margin:2em 0}
code{font-size:16px}
.list a{display:block;text-decoration:none;color:var(--ink);padding:18px 0;border-bottom:1px solid var(--rule)}
.list .t{font-size:22px}.list .d{font:13px var(--sans);color:var(--ink-dim);margin-top:4px}
footer{margin-top:48px;padding-top:24px;border-top:1px solid var(--rule);font:14px var(--sans);color:var(--ink-dim)}
footer a{color:var(--ink)}
.sub{font:15px var(--sans);margin:40px 0 0}
.tgrow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin:24px 0 0}
@media(max-width:520px){.tgb{font-size:14px;padding:8px 14px}}
.cm{margin:32px 0 0}
.cm .cmt{background:none;border:0;padding:0;cursor:pointer;font:10px var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.cm .cmt::after{content:" +"}.cm.open .cmt::after{content:" −"}
.cmw{max-height:0;overflow:hidden}.cm.open .cmw{max-height:none;margin-top:16px}
.tgb{display:inline-block;font:15px var(--sans);padding:10px 18px;border:1px solid var(--gold);border-radius:22px;
 text-decoration:none;color:var(--gold)}.tgb:hover{background:var(--gold);color:var(--ground)}
.lang{position:fixed;top:14px;right:14px;z-index:50;display:flex;gap:2px;background:rgba(0,0,0,.7);
 border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:4px}
.lang a,.lang b{font:600 12px/1 var(--sans);letter-spacing:.14em;padding:6px 12px;border-radius:16px;text-decoration:none;color:#b9b2a8}
.lang a:hover{color:#f2ede4}.lang b{color:#111;background:#c9a227}
.tr{font:13px var(--sans);color:var(--ink-dim);margin:-24px 0 36px}
.cr{font:12px/1.6 var(--sans);color:var(--ink-dim);margin:10px 0 0;opacity:.8}
</style></head>
